; FoggyMap - exploration fog of war.
;
; The plugin only reads game state. It writes CSVs outside the game folder and draws a
; layer on the Pip-Boy map; it never touches your save or your load order.

[FoggyMap]

; Where the CSVs and fog files go. Defaults to %LOCALAPPDATA%\FoggyMap.
; Deliberately outside Data\ so it never lands in Mod Organizer's overwrite folder.
; OutputDir=<REPO>\data

; How often your position is captured, in milliseconds. Minimum 250.
SampleIntervalMs=1000

; Ignore a sample unless you have moved this far since the last one, so standing still
; does not fill the file. 70 units is one metre.
MinMoveUnits=256

; ...but record one anyway after this many seconds, so idle time still shows up.
ForceSampleSeconds=30

; --- Companion process ---
;
; The companion is the headless fog exporter. It has NO window: it watches the CSVs and
; computes the fog the Pip-Boy draws. Turning it off freezes the in-game fog at whatever
; it last wrote, so leave it on unless you are debugging.
;
; It replaced the desktop window in this role because a window can throw inside its event
; loop and die silently, which is exactly what happened -- the in-game fog then looks
; merely stale rather than broken. Anything the companion prints, including a crash
; traceback, is captured to companion.log in OutputDir.
;
; For the desktop map window, run viewer\viewer.pyw yourself, or point this at it.
; Edit the paths below to match where you cloned this repo. The build installs this file
; only when one is not already deployed, so your edited copy is never overwritten.
AutoLaunchCompanion=1
CompanionCommand="<REPO>\.venv\Scripts\pythonw.exe" "<REPO>\viewer\export_fog.pyw"

; --- Pip-Boy fog overlay ---
;
; Draws the fog as a vector layer attached to the map page's own TextureHolder_mc, whose
; coordinate space is exactly the map image. So the fog inherits FallUI's pan and zoom
; with no alignment maths, the map art is never modified, and markers still draw on top.
;
; Three earlier approaches are not coming back, for recorded reasons: swapping the map's
; D3D pointers has no effect (Scaleform builds its own image once and never re-reads
; them), WorldMapHolder_mc.SetTexture refuses every argument shape, and this Scaleform
; build refuses per-pixel bitmap writes -- hence rectangles.
PipboyOverlay=1

; How heavy the fog looks at its densest, 0 to 1. Raise for more contrast between
; explored and unexplored, lower if it obscures the map too much.
PipboyFogStrength=0.85

; Cells across the map. Higher follows the shape of your explored area more closely and
; looks less like a grid. Cost rises far less than proportionally, because runs of equal
; fog merge into single fills: 64 -> ~340 fills, 128 -> ~650, 256 -> ~1250.
; Must divide 2048 evenly: 64, 128, 256.
PipboyFogGrid=256
